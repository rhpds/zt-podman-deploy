---
virtualmachines:
  - name: "rhel"
    image: "rhel-10-0-07-09-25-3"
    bootloader: efi
    memory: "4G"
    cores: 1
    image_size: "40G"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
    networks:
      - default
    services:
      - name: hostinfo
        ports:
          - port: 8000
            protocol: TCP
            targetPort: 8000
            name: hostinfo
    routes:
      - name: hostinfo
        host: hostinfo
        service: hostinfo
        targetPort: 8000
        tls: false
